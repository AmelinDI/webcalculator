<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Вход — Локальный калькулятор</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
      .wrap { max-width: 420px; margin: 60px auto; padding: 0 16px; box-sizing: border-box; }
      .card { border: 1px solid rgba(127,127,127,.35); border-radius: 12px; padding: 20px; box-sizing: border-box; }
      label { display: block; font-size: 12px; opacity: .8; margin: 14px 0 6px; }
      input, button { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(127,127,127,.35); background: transparent; font-size: 16px; box-sizing: border-box; }
      button { cursor: pointer; margin-top: 18px; }
      .msg { margin-bottom: 12px; font-size: 14px; min-height: 1.2em; }
      .error { color: #c62828; }
      .ok { color: #2e7d32; }
      .muted { opacity: .7; font-size: 12px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>Локальный калькулятор</h2>
      <div class="card">
        <div id="msg" class="msg"></div>
        <form id="loginForm">
          <label for="username">Логин</label>
          <input id="username" name="username" type="text" autofocus required />
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required />
          <button type="submit">Войти</button>
        </form>
        <div class="muted">Демо-пользователь: <code>user</code> / <code>password</code></div>
      </div>
    </div>

    <script>
      const msgEl = document.getElementById("msg");
      const form = document.getElementById("loginForm");
      const params = new URLSearchParams(location.search);

      function setMsg(text, isError) {
        msgEl.textContent = text;
        msgEl.classList.toggle("error", !!isError);
        msgEl.classList.toggle("ok", !isError);
      }

      if (params.has("error")) setMsg("Неверный логин или пароль", true);
      if (params.has("logout")) setMsg("Вы вышли из системы", false);

      function csrfToken() {
        const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : "";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg("Входим…", false);
        const body = new URLSearchParams(new FormData(form)).toString();
        const res = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-XSRF-TOKEN": csrfToken(),
          },
          body,
        });
        if (res.url.includes("error")) {
          setMsg("Неверный логин или пароль", true);
        } else {
          location.href = "/";
        }
      });
    </script>
  </body>
</html>
